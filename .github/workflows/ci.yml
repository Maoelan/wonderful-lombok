name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Test, audit, and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUBLIC_CONVEX_URL: https://ci-placeholder.convex.cloud
      CONVEX_SERVER_SECRET: ci-placeholder-not-a-real-secret
      PUBLIC_RENTAL_ENABLED: "false"
      PUBLIC_SITE_URL: http://127.0.0.1:5173

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.20.0
          cache: npm

      - name: Scan tracked files for secrets
        run: npm run scan:secrets

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Build production application
        run: npm run build
